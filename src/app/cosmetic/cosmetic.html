<div class="container mt-4">
  <h2>Cosmetic Products</h2>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card h-100" (click)="viewProduct(product.id)" style="cursor: pointer;">
        <img [src]="product.image" class="card-img-top" alt="{{product.title}}" style="height: 200px; object-fit: cover;">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{product.title}}</h5>
          <p class="card-text flex-grow-1">{{product.description | slice:0:100}}...</p>
          <div class="mt-auto">
            <p class="card-text"><strong>${{product.price}}</strong></p>
            <button class="btn btn-primary" (click)="$event.stopPropagation()">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
