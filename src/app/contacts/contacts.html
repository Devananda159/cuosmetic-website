<div class="container mt-4">
  <h2>Contact Us</h2>
  <div class="row">
    <!-- Contact Information - Left Side -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h4>Our Contact Information</h4>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <h6><i class="fas fa-map-marker-alt"></i> Address</h6>
            <p>123 Beauty Street<br>Cosmetic City, CC 12345<br>United States</p>
          </div>
          <div class="mb-3">
            <h6><i class="fas fa-phone"></i> Phone</h6>
            <p>+1 (555) 123-4567</p>
          </div>
          <div class="mb-3">
            <h6><i class="fas fa-envelope"></i> Email</h6>
            <p>info@cosmeticstore.com</p>
          </div>
          <div class="mb-3">
            <h6><i class="fas fa-clock"></i> Business Hours</h6>
            <p>Monday - Friday: 9:00 AM - 6:00 PM<br>Saturday: 10:00 AM - 4:00 PM<br>Sunday: Closed</p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Message Form - Right Side -->
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h4>Send Us a Message</h4>
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="name" class="form-label">Full Name *</label>
              <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address *</label>
              <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone">
            </div>
            <div class="mb-3">
              <label for="subject" class="form-label">Subject *</label>
              <input type="text" class="form-control" id="subject" required>
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message *</label>
              <textarea class="form-control" id="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
